name: CI

on:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Build
        uses: swatinem/rust-cache@v2

      - name: Cargo Check
        run: cargo check

      - name: Cargo Format
        run: cargo fmt --check

      - name: Cargo Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo Test
        run: cargo test

  forecaster:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forecaster
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Dependencies
        run: uv sync --frozen

      - name: Pytest
        run: uv run pytest
