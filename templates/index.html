<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Energy Planner</title>
    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>
    <style>
        :root {
            color-scheme: light;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            margin: 0;
            padding: 1rem;
            overflow-x: hidden;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 0.25rem;
            font-size: 1.4rem;
        }

        .meta {
            color: #555;
            margin: 0 0 1rem;
            font-size: 0.95rem;
        }

        .overview {
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            padding: 0.9rem;
            margin: 0 0 1rem;
        }

        .overview-title {
            margin: 0 0 0.5rem;
            font-size: 1rem;
        }

        .overview-grid {
            display: grid;
            gap: 0.35rem 1rem;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .overview-item {
            margin: 0;
            font-size: 0.92rem;
            color: #222;
        }

        .overview-item strong {
            color: #555;
            font-weight: 600;
        }

        .empty {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            background: #fafafa;
        }

        /* Keep Plotly figures inside the viewport width. */
        .js-plotly-plot,
        .plot-container,
        .plotly-graph-div {
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box;
        }

        @media (max-width: 700px) {
            body {
                padding: 0.6rem;
            }

            h1 {
                font-size: 1.2rem;
            }

            .meta {
                font-size: 0.88rem;
            }

            .overview-grid {
                grid-template-columns: 1fr;
            }

        }
    </style>
</head>
<body>
    <main>
        <h1>Energy Planning</h1>
        <section class="overview" id="overview" aria-label="Planning overview" hidden></section>
        <p class="meta"><span id="interval-count"></span> <span id="connection">connecting…</span></p>
        <div id="plots"></div>
        <p class="meta" id="no-plan" hidden>No planning result available yet.</p>
        <div class="empty" id="no-plan-detail" hidden>The optimizer has not published a planning result yet.</div>
    </main>
    <script>
        // Relative URLs: the page may be served under Home Assistant's ingress path prefix.
        (function () {
            const SILENCE_BEFORE_POLLING_MS = 45000; // server pings every 15 s
            const POLL_INTERVAL_MS = 30000;
            let shownVersion = null;
            let fetching = null;

            const separator = () => {
                const div = document.createElement("div");
                div.style.cssText = "height:1px;background:#d9d9d9;margin:0.5rem 0 0.9rem 0;";
                return div;
            };

            // Charts are read-only: no zooming or panning.
            const lockInteractions = (figure) => {
                const layout = { ...figure.layout, dragmode: false };
                Object.keys(layout).forEach((key) => {
                    if (/^[xy]axis\d*$/.test(key)) {
                        layout[key] = { ...layout[key], fixedrange: true };
                    }
                });
                layout.xaxis = { ...(layout.xaxis || {}), fixedrange: true };
                layout.yaxis = { ...(layout.yaxis || {}), fixedrange: true };
                return layout;
            };

            const render = (plan) => {
                const hasPlan = plan.interval_count > 0;
                document.getElementById("no-plan").hidden = hasPlan;
                document.getElementById("no-plan-detail").hidden = hasPlan;
                const overview = document.getElementById("overview");
                overview.hidden = !hasPlan;
                overview.innerHTML = plan.overview_html;
                document.getElementById("interval-count").textContent =
                    hasPlan ? `Generated for ${plan.interval_count} intervals.` : "";

                const container = document.getElementById("plots");
                plan.plots.forEach(({ id, figure }, index) => {
                    let div = document.getElementById(id);
                    if (!div) {
                        if (index > 0) container.appendChild(separator());
                        div = document.createElement("div");
                        div.id = id;
                        container.appendChild(div);
                    }
                    window.Plotly.react(div, figure.data, lockInteractions(figure), figure.config);
                });
                shownVersion = plan.version;
            };

            // One fetch at a time; a newer version arriving meanwhile triggers another.
            const refresh = async (version) => {
                if (version !== undefined && version === shownVersion) return;
                if (fetching) return fetching.then(() => refresh(version));
                fetching = (async () => {
                    try {
                        const response = await fetch("plan", { cache: "no-store" });
                        if (response.ok) render(await response.json());
                    } catch (e) {
                        console.warn("Failed to load plan", e);
                    }
                })();
                await fetching;
                fetching = null;
            };

            const setConnection = (text) => {
                document.getElementById("connection").textContent = text;
            };

            const startPolling = () => {
                setConnection("· updating every 30 s (live updates unavailable)");
                setInterval(async () => {
                    try {
                        const response = await fetch("version", { cache: "no-store" });
                        if (response.ok) refresh((await response.json()).version);
                    } catch (e) {
                        console.warn("Failed to check plan version", e);
                    }
                }, POLL_INTERVAL_MS);
            };

            refresh();

            if (!window.EventSource) {
                startPolling();
                return;
            }
            let lastEvent = Date.now();
            const events = new EventSource("events");
            events.addEventListener("plan", (event) => {
                lastEvent = Date.now();
                setConnection("· live");
                refresh(Number(event.data));
            });
            events.addEventListener("ping", () => {
                lastEvent = Date.now();
                setConnection("· live");
            });
            events.addEventListener("error", () => setConnection("· reconnecting…"));
            // A buffering proxy delivers neither updates nor pings: fall back to polling.
            const watchdog = setInterval(() => {
                if (Date.now() - lastEvent > SILENCE_BEFORE_POLLING_MS) {
                    clearInterval(watchdog);
                    events.close();
                    startPolling();
                }
            }, 5000);
        })();
    </script>
</body>
</html>
