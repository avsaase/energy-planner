name: "Energy Planner"
version: "0.2.2"
slug: "energy_planner"
description: "LP-based energy optimization"
arch:
  - amd64
  # - aarch64
url: "https://github.com/avsaase/energy-planner"
ingress: true
ingress_port: 8099
homeassistant_api: true
panel_icon: "mdi:battery-charging"
panel_title: "Energy Planner"
image: "ghcr.io/avsaase/{arch}-energy-planner"
init: false
options:
  solar_forecast_entities:
    - "sensor.energy_production_today_2"
    - "sensor.energy_production_tomorrow_2"
    - "sensor.energy_production_d2"
  battery_parameters:
    capacity_wh: 5120
    lifetime_cycles: 6000
    purchase_cost_eur: 1345
    max_charge_power_w: 2500
    max_discharge_power_w: 2500
    charge_conversion_efficiency: 0.9
    charge_fixed_power_loss_w: 10
    discharge_conversion_efficiency: 0.9
    discharge_fixed_power_loss_w: 10
    idle_power_loss_w: 5
    min_soc_percent: 0.12
    max_soc_percent: 1.0
  solver_parameters:
    early_charge_bonus_per_kwh: 0.001
    early_charge_bonus_decay_hours: 12
  electricity_price_parameters:
    supplier_cost_import_eur_per_kwh: 0.0182
    supplier_cost_export_eur_per_kwh: -0.0182
    energy_tax_import_eur_per_kwh: 0.09161
    energy_tax_export_eur_per_kwh: 0
    vat_import: 0.21
    vat_export: 0
  battery_soc_entity: "sensor.marstek_venus_e_v3_1_modbus_battery_soc"
  # Power sensors; house load = grid + PV + battery. They need long-term statistics
  # (state_class: measurement). Conventions: grid + import, battery + discharge (use *_invert
  # otherwise).
  sensors:
    grid_power_entity: "sensor.p1_meter_power"
    grid_power_invert: false
    solar_power_entity: "sensor.solar_power"
    battery_power_entity: "sensor.marstek_venus_e_v3_1_modbus_battery_power"
    battery_power_invert: false
  replanning:
    net_load_change_threshold_w: 300
    net_load_change_sustain_seconds: 15
    min_interval_seconds: 20
    soc_deviation: 0.03
    scenario_quantile: 0.9
    scenario_min_spread_w: 300
  # Days of complete replan records (inputs and plans) kept in /data/runs; 0 disables.
  run_log_days: 7
schema:
  solar_forecast_entities:
    - str
  battery_parameters:
    capacity_wh: float
    lifetime_cycles: int
    purchase_cost_eur: float
    max_charge_power_w: float
    max_discharge_power_w: float
    charge_conversion_efficiency: float
    discharge_conversion_efficiency: float
    charge_fixed_power_loss_w: float
    discharge_fixed_power_loss_w: float
    idle_power_loss_w: float
    min_soc_percent: float
    max_soc_percent: float
  solver_parameters:
    early_charge_bonus_per_kwh: float
    early_charge_bonus_decay_hours: int(1,48)
  electricity_price_parameters:
    supplier_cost_import_eur_per_kwh: float
    supplier_cost_export_eur_per_kwh: float
    energy_tax_import_eur_per_kwh: float
    energy_tax_export_eur_per_kwh: float
    vat_import: float
    vat_export: float
  battery_soc_entity: str
  sensors:
    grid_power_entity: str
    grid_power_invert: bool
    solar_power_entity: str
    battery_power_entity: str
    battery_power_invert: bool
    outdoor_temperature_entity: str?
    weather_entity: str?
  replanning:
    net_load_change_threshold_w: float
    net_load_change_sustain_seconds: int(1,600)
    min_interval_seconds: int(5,3600)
    soc_deviation: float(0,1)
    scenario_quantile: float(0.5,0.99)
    scenario_min_spread_w: float
  run_log_days: int(0,90)?
