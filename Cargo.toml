[package]
name = "energy-planner"
version = "0.1.0"
edition = "2024"
default-run = "energy-planner"

[dependencies]
anyhow = "1.0.100"
askama = "0.15.6"
axum = { version = "0.8.8", features = ["macros"] }
derive_more = { version = "2.1.1", features = ["deref"] }
futures = "0.3.32"
good_lp = { version = "1.14.2", default-features = false, features = ["highs"] }
itertools = "0.14.0"
jiff = { version = "0.2.18", features = ["serde"] }
plotly = { version = "0.14.0" }
reqwest = { version = "0.13.2", features = ["json"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51.1", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# ONNX Runtime for the forecast model; `download-binaries` links a prebuilt runtime statically.
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "tracing", "download-binaries", "tls-native"] }

[dev-dependencies]
tokio = { version = "1.51.1", features = ["full", "test-util"] }

[features]
default = ["control-battery"]
control-battery = []
